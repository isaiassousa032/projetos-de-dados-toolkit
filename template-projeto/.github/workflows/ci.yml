name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Roda o pipeline de exemplo de ponta a ponta (sem rede e sem segredos).
      # Ao trocar o exemplo por uma fonte real, mantenha aqui apenas o que
      # roda sem credenciais (ex.: ingestão com dados de amostra + dbt build).
      - run: make all
